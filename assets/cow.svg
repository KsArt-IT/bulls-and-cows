  <ellipse cx="100" cy="134" rx="38" ry="24" fill="#f4b6c2" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="87" cy="132" rx="5" ry="8" fill="#c0607a"/>
  <ellipse cx="113" cy="132" rx="5" ry="8" fill="#c0607a"/>
  <!-- smile -->
  <path d="M88 146 C94 152 106 152 112 146" fill="none" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round"/>
