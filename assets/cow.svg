  <circle cx="118" cy="98" r="8" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
  <circle cx="83" cy="99" r="4" fill="#1a1a1a"/>
  <circle cx="117" cy="99" r="4" fill="#1a1a1a"/>
  <!-- lashes -->
