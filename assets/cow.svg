  <path d="M62 56 C74 44 126 44 138 56 C150 70 148 108 140 130 C134 146 66 146 60 130 C52 108 50 70 62 56 Z" fill="#fafafa" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
