  <ellipse cx="42" cy="82" rx="24" ry="12" transform="rotate(-15 42 82)" fill="#fafafa" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="158" cy="82" rx="24" ry="12" transform="rotate(15 158 82)" fill="#fafafa" stroke="#2b2b2b" stroke-width="3"/>
  <ellipse cx="44" cy="82" rx="14" ry="6" transform="rotate(-15 44 82)" fill="#f4b6c2"/>
  <ellipse cx="156" cy="82" rx="14" ry="6" transform="rotate(15 156 82)" fill="#f4b6c2"/>
